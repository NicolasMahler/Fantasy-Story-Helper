# Runs the tests, type check and build on every pull request, so problems show up before merging to main.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Same npm pin as deploy.yml: npm 10 rejects this lock file.
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
